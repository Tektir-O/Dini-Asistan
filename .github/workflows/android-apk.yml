name: Build Offline Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download 604 Mushaf pages
        run: python3 scripts/download_mushaf.py

      - name: Validate offline assets
        run: python3 scripts/validate_assets.py

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK is offline and complete
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q "android.permission.INTERNET"; then
            echo "ERROR: APK requests INTERNET permission"
            exit 1
          fi
          COUNT=$(unzip -l "$APK" | awk '{print $4}' | grep -E '^assets/mushaf/p[0-9]+\.png$' | wc -l)
          test "$COUNT" -eq 604
          unzip -l "$APK" | grep -q 'assets/mushaf/p1.png'
          unzip -l "$APK" | grep -q 'assets/mushaf/p604.png'
          cp "$APK" Dini-Asistan-offline.apk
          ls -lh Dini-Asistan-offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dini-Asistan-offline
          path: Dini-Asistan-offline.apk
          if-no-files-found: error
          retention-days: 30

name: Premium Quran Tasarim Kontrolu
on:
  push:
    paths:
      - '.github/workflows/premium-tasarim-kontrol.yml'
      - 'app/src/main/java/com/diniasistanim/app/MainActivity.java'
  workflow_dispatch:

jobs:
  android-ui-compile:
    name: Android premium ekranlarini derle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check premium Quran Android Java UI
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

name: Dini Asistanim Sesli APK Dogrudan Indirme Parsalari
on:
  push:
    paths:
      - '.github/workflows/split-huzeyfi-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download successful complete audio APK from existing GitHub Actions run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original
          gh run download 37740945810 -R "${{ github.repository }}" \
            --name Dini-Asistanim-Tam-Huzeyfi-Hafs-APK --dir original
          ls -lh original/
      - name: Verify APK digest and split for direct delivery
        run: |
          set -euo pipefail
          test -s original/Dini-Asistanim-Tam-Huzeyfi-Hafs.apk
          expected="$(cut -d ' ' -f 1 original/Dini-Asistanim-APK-SHA256.txt)"
          actual="$(sha256sum original/Dini-Asistanim-Tam-Huzeyfi-Hafs.apk | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          mkdir -p parts
          split -b 195M -d -a 2 --additional-suffix=.part \
            original/Dini-Asistanim-Tam-Huzeyfi-Hafs.apk parts/Huzeyfi-APK-
          test "$(find parts -name '*.part' | wc -l)" -eq 4
          for p in parts/*.part; do sha256sum "$p"; done
          echo "VERIFIED_ORIGINAL_APK_SHA256=$actual"
          ls -lh parts/
      - name: Deliver APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: Huzeyfi-APK-00
          path: parts/Huzeyfi-APK-00.part
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Deliver APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: Huzeyfi-APK-01
          path: parts/Huzeyfi-APK-01.part
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Deliver APK part 3
        uses: actions/upload-artifact@v4
        with:
          name: Huzeyfi-APK-02
          path: parts/Huzeyfi-APK-02.part
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Deliver APK part 4
        uses: actions/upload-artifact@v4
        with:
          name: Huzeyfi-APK-03
          path: parts/Huzeyfi-APK-03.part
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

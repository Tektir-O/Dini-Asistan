name: Audit Mushaf PDF Page Order
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-mushaf-page-order.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install page inspection dependencies
        run: python -m pip install --no-cache-dir PyMuPDF Pillow requests
      - name: Download known 1441H Mushaf PDF source and draw sample sheets
        run: |
          python - <<'PY'
          import requests
          url="https://archive.org/download/MushafMadinaHafsGreen1441/MushafMadinaHafsGreen1441.pdf"
          with requests.get(url,stream=True,timeout=(50,170)) as r:
              r.raise_for_status()
              with open("mushaf-source.pdf","wb") as f:
                  for chunk in r.iter_content(2*1024*1024):
                      if chunk:f.write(chunk)
          PY
          python scripts/audit_mushaf_pages.py mushaf-source.pdf

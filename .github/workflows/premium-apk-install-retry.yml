name: Dini Asistan Premium APK - Install Retry and QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/premium-apk-install-retry.yml"
      - ".github/scripts/premium-apk-emulator-smoke.sh"

permissions:
  actions: read
  contents: read

concurrency:
  group: premium-apk-install-retry
  cancel-in-progress: false

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "37817237793"
      APK: "app-test/DiniAsistan-Premium-AyetAyet-Debug.apk"
      PACKAGE: "com.dini.asistan.premium"
    steps:
      - uses: actions/checkout@v4

      - name: Reuse previously built and signed Premium APK - do not redownload 6236 ayahs
        run: |
          set -euo pipefail
          mkdir -p app-test
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name dini-asistan-premium-ayet-ayet-debug-apk --dir app-test
          test -s "$APK"
          unzip -tq "$APK" | tail -1
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Enable KVM hardware acceleration on GitHub runner
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "::error::Hosted runner has no /dev/kvm; do not start slow software-emulated x86 Android"; exit 1; }
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "PASS: /dev/kvm accessible. Android emulator can use hardware acceleration."

      - name: Validate Android Bash smoke script syntax
        run: bash -n .github/scripts/premium-apk-emulator-smoke.sh

      - name: Install and verify real Arabic ayah playback on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 6144M
          heap-size: 512M
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/premium-apk-emulator-smoke.sh

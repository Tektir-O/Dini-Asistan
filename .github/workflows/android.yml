name: Dini Asistanim Kod ve Icerik Kontrolu
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Quran index
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run generate:index
      - name: Offline Turkish Rowad meal
        run: node scripts/prepare_meal.mjs
      - name: Mushaf
        run: bash scripts/prepare_mushaf.sh
      - name: Integrity verification
        run: |
          test "$(find app/src/main/assets/mushaf/pages -name '*.png' | wc -l)" -eq 604
          test "$(wc -l < app/src/main/assets/mushaf/page-sha256.txt)" -eq 604
          (cd app/src/main/assets/mushaf/pages && sha256sum -c ../page-sha256.txt > /dev/null)
      - name: Check Turkish meal is bundled
        run: test -s app/src/main/assets/meal-rowad.json
      - name: Prepare offline Huzayfi audio if official source is configured
        env:
          HUZAYFI_AUDIO_ARCHIVE_URL: ${{ secrets.HUZAYFI_AUDIO_ARCHIVE_URL }}
          HUZAYFI_AUDIO_ARCHIVE_SHA256: ${{ secrets.HUZAYFI_AUDIO_ARCHIVE_SHA256 }}
        run: |
          if [ -z "$HUZAYFI_AUDIO_ARCHIVE_URL" ]; then
            echo "::notice::Official audio ZIP is not configured; Java compile only, offline playback NOT verified."
          else
            if [ -n "$HUZAYFI_AUDIO_ARCHIVE_SHA256" ]; then
              python3 scripts/prepare_huzayfi_audio.py --url "$HUZAYFI_AUDIO_ARCHIVE_URL" --expected-sha256 "$HUZAYFI_AUDIO_ARCHIVE_SHA256"
            else
              echo "::error::Provide the trusted source ZIP SHA-256 before packaging audio."
              exit 1
            fi
            python3 scripts/verify_huzayfi_audio.py
          fi
      - name: Verify any included offline Arabic recordings
        run: |
          if [ -d app/src/main/assets/audio-ar/huzayfi-hafs ]; then
            python3 scripts/verify_huzayfi_audio.py
          else
            echo "::warning::114-surah Arabic offline package has not been supplied. Build is code-only."
          fi
      - name: Compile Android Java without making or publishing an APK
        run: gradle :app:compileDebugJavaWithJavac --stacktrace --no-daemon

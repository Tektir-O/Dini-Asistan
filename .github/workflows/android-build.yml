name: Dini Asistan Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - "mp3_service/**"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - "mp3_service/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Android test + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK paketlerini kur
        run: |
          echo "Android SDK path: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: MP3 servisi birim ve HTTP testleri
        run: (cd mp3_service && python3 -m unittest -v test_app)
      - name: Kotlin birim testleri ve APK derle
        run: gradle --no-daemon -Pmp3TestStandalone=true :app:testDebugUnitTest :app:assembleDebug
      - name: MP3 icin internet izni ve HTTPS guvenligi kontrolu
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          grep -q "android.permission.INTERNET" permissions.txt
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Derlenen APK'yi kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dini-asistan-ilk-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
